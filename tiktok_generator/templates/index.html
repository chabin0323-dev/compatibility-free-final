<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok動画生成 | NEXA Tools</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;background:linear-gradient(160deg,#0a0518,#150830,#0a0518);min-height:100vh;color:#e8e0ff;padding:20px 14px 60px}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(1px 1px at 20% 15%,rgba(255,255,255,.6) 0%,transparent 100%),radial-gradient(1px 1px at 70% 30%,rgba(255,255,255,.5) 0%,transparent 100%),radial-gradient(1px 1px at 45% 60%,rgba(255,255,255,.4) 0%,transparent 100%),radial-gradient(1px 1px at 85% 70%,rgba(255,255,255,.6) 0%,transparent 100%);pointer-events:none;z-index:0}
    .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto}
    header{text-align:center;margin-bottom:24px}
    header h1{font-size:24px;color:#d4aaff;letter-spacing:2px}
    header p{color:#8060b0;font-size:12px;margin-top:5px}
    .card{background:rgba(255,255,255,.045);border:1px solid rgba(180,100,255,.18);border-radius:16px;padding:20px;margin-bottom:14px;backdrop-filter:blur(6px)}
    .lbl{display:block;font-size:11px;color:#9b7ec8;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
    .lbl:first-child{margin-top:0}
    textarea,input[type=text],select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(180,100,255,.25);border-radius:8px;color:#e8e0ff;font-size:14px;padding:10px 12px;outline:none;font-family:inherit;transition:border-color .2s}
    textarea{height:180px;resize:vertical}
    textarea:focus,input[type=text]:focus,select:focus{border-color:rgba(200,120,255,.55)}
    textarea::placeholder{color:#604880}
    select option{background:#1a0a3a;color:#e8e0ff}
    .theme-row{display:flex;gap:8px;margin-top:2px}
    .tbtn{flex:1;padding:9px 4px;border-radius:8px;border:2px solid transparent;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
    .tbtn.mystic{background:#1e0a4a;color:#c890ff;border-color:#5a28a0}
    .tbtn.dark{background:#0a0a1e;color:#a878f0;border-color:#3a1878}
    .tbtn.pink{background:#380a28;color:#ffb0d0;border-color:#781848}
    .tbtn.active{border-color:#c890ff;box-shadow:0 0 12px rgba(180,100,255,.35)}
    .upload-area{border:2px dashed rgba(180,100,255,.3);border-radius:8px;padding:16px;text-align:center;cursor:pointer;color:#8060b0;font-size:13px;transition:.2s;margin-top:2px}
    .upload-area:hover{border-color:rgba(180,100,255,.6);color:#b89de0}
    .upload-area input{display:none}
    .file-list{margin-top:8px;font-size:12px;color:#a080c8}
    .gen-btn{width:100%;margin-top:16px;padding:14px;background:linear-gradient(135deg,#6520b0,#a040d0);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px}
    .gen-btn:disabled{opacity:.45;cursor:not-allowed}
    #progress-card{display:none;text-align:center;padding:32px}
    .spinner{width:44px;height:44px;border:3px solid rgba(180,100,255,.25);border-top-color:#c890ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    #progress-text{color:#b89de0;font-size:14px}
    #result-card{display:none}
    .preview-video{width:100%;border-radius:10px;margin-bottom:14px;max-height:400px;background:#000}
    .dl-btn{display:block;width:100%;padding:13px;background:linear-gradient(135deg,#1060a8,#2080cc);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;margin-bottom:10px}
    .reset-btn{width:100%;padding:11px;background:rgba(255,255,255,.07);color:#c0a8e0;border:1px solid rgba(180,100,255,.2);border-radius:12px;font-size:14px;cursor:pointer}
    #error-card{display:none;text-align:center;padding:24px}
    .err{color:#ff8888;font-size:13px;margin-bottom:16px;word-break:break-all}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔮 TikTok動画生成</h1>
    <p>NEXA Tools &nbsp;|&nbsp; 占い記事 → 縦型TikTok動画</p>
  </header>

  <div class="card" id="form-card">
    <label class="lbl">占い記事テキスト</label>
    <textarea id="article" placeholder="ここに占い記事を貼り付けてください..."></textarea>

    <label class="lbl">テーマ</label>
    <div class="theme-row">
      <button class="tbtn mystic active" data-theme="mystic" onclick="selTheme(this)">🌙 Mystic</button>
      <button class="tbtn dark" data-theme="dark" onclick="selTheme(this)">🌌 Dark</button>
      <button class="tbtn pink" data-theme="pink" onclick="selTheme(this)">🌸 Pink</button>
    </div>

    <label class="lbl">読み上げ音声</label>
    <select id="voice">
      <option value="nanami">七海（女性・自然）</option>
      <option value="aoi">葵（女性・明るい）</option>
      <option value="shiori">詩織（女性・優しい）</option>
      <option value="mayu">真夕（女性・落ち着き）</option>
      <option value="keita">慶太（男性・自然）</option>
      <option value="daichi">大地（男性・低め）</option>
    </select>

    <label class="lbl">背景写真（任意・複数可）</label>
    <div class="upload-area" onclick="document.getElementById('photo-input').click()">
      <input type="file" id="photo-input" accept="image/*" multiple onchange="onPhotos(this)">
      📷 写真をクリックで選択（jpg/png/webp）<br>
      <span style="font-size:11px">写真を選ぶと各シーンの背景に使用されます</span>
    </div>
    <div class="file-list" id="file-list"></div>

    <button class="gen-btn" id="gen-btn" onclick="startGen()">✨ 動画を生成する</button>
  </div>

  <div class="card" id="progress-card">
    <div class="spinner"></div>
    <div id="progress-text">動画を生成中... (1〜2分かかります)</div>
  </div>

  <div class="card" id="result-card">
    <div style="text-align:center;color:#c890ff;font-size:18px;font-weight:700;margin-bottom:14px">動画が完成しました！</div>
    <video class="preview-video" id="preview-video" controls playsinline></video>
    <a id="dl-btn" href="#" class="dl-btn">⬇ 動画をダウンロード (.mp4)</a>
    <button class="reset-btn" onclick="resetForm()">もう一度生成する</button>
  </div>

  <div class="card" id="error-card">
    <div class="err" id="err-msg">エラーが発生しました</div>
    <button class="reset-btn" onclick="resetForm()">もう一度試す</button>
  </div>
</div>

<script>
  let theme = 'mystic';
  let photoFiles = [];

  function selTheme(btn) {
    document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    theme = btn.dataset.theme;
  }

  function onPhotos(input) {
    photoFiles = Array.from(input.files);
    document.getElementById('file-list').textContent =
      photoFiles.length ? `${photoFiles.length}枚の写真を選択` : '';
  }

  function show(id) {
    ['form-card','progress-card','result-card','error-card'].forEach(c =>
      document.getElementById(c).style.display = c === id ? 'block' : 'none');
  }

  async function startGen() {
    const article = document.getElementById('article').value.trim();
    if (!article) { alert('記事テキストを入力してください'); return; }
    document.getElementById('gen-btn').disabled = true;
    show('progress-card');

    try {
      const fd = new FormData();
      fd.append('article', article);
      fd.append('theme', theme);
      fd.append('voice', document.getElementById('voice').value);
      photoFiles.forEach(f => fd.append('photos', f));

      const res = await fetch('/api/generate', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok || data.error) { showErr(data.error || 'エラー'); return; }

      const jobId = data.job_id;
      document.getElementById('dl-btn').href = '/api/download/' + jobId;
      document.getElementById('preview-video').src = '/api/preview/' + jobId;
      show('result-card');
    } catch (e) {
      showErr('通信エラー: ' + e.message);
    }
  }

  function showErr(msg) {
    document.getElementById('err-msg').textContent = msg;
    show('error-card');
  }

  function resetForm() {
    document.getElementById('gen-btn').disabled = false;
    document.getElementById('preview-video').src = '';
    show('form-card');
  }
</script>
</body>
</html>
