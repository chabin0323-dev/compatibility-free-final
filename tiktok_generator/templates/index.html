<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok動画生成 | NEXA Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Yu Gothic', sans-serif;
      background: linear-gradient(160deg, #0a0518 0%, #150830 50%, #0a0518 100%);
      min-height: 100vh;
      color: #e8e0ff;
      padding: 24px 16px 60px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 60%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 70%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 55% 10%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 45%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 24px; color: #d4aaff; letter-spacing: 2px; }
    header p { color: #8060b0; font-size: 12px; margin-top: 6px; }

    .hint {
      background: rgba(100,60,200,.15);
      border: 1px solid rgba(180,100,255,.2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: #a080d0;
      margin-bottom: 18px;
      line-height: 1.6;
    }
    .hint a { color: #c090ff; }

    .card {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(180,100,255,.18);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      backdrop-filter: blur(6px);
    }

    .field-label {
      display: block;
      font-size: 11px;
      color: #9b7ec8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input[type=text], textarea {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(180,100,255,.25);
      border-radius: 8px;
      color: #e8e0ff;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    input[type=text]:focus, textarea:focus { border-color: rgba(200,120,255,.55); }
    input[type=text]::placeholder, textarea::placeholder { color: #604880; }

    .script-grid { display: flex; flex-direction: column; gap: 8px; }
    .script-row { display: flex; align-items: center; gap: 8px; }
    .script-num {
      width: 24px; height: 24px;
      background: rgba(180,100,255,.2);
      border-radius: 50%;
      font-size: 12px;
      color: #b080e0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .row { margin-bottom: 16px; }

    .theme-row { display: flex; gap: 10px; }
    .theme-btn {
      flex: 1; padding: 10px 6px;
      border-radius: 10px;
      border: 2px solid transparent;
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }
    .theme-btn.mystic { background: #1e0a4a; color: #c890ff; border-color: #5a28a0; }
    .theme-btn.dark   { background: #0a0a1e; color: #a878f0; border-color: #3a1878; }
    .theme-btn.pink   { background: #380a28; color: #ffb0d0; border-color: #781848; }
    .theme-btn.active { border-color: #c890ff; box-shadow: 0 0 14px rgba(180,100,255,.35); }

    .gen-btn {
      width: 100%; margin-top: 6px; padding: 15px;
      background: linear-gradient(135deg, #6520b0, #a040d0);
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      letter-spacing: 1px; transition: opacity .2s;
    }
    .gen-btn:disabled { opacity: .45; cursor: not-allowed; }

    #progress-card { display: none; text-align: center; padding: 36px; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(180,100,255,.25);
      border-top-color: #c890ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #progress-text { color: #b89de0; font-size: 14px; }

    #result-card { display: none; }
    .dl-btn {
      display: block; width: 100%; margin-top: 20px; padding: 14px;
      background: linear-gradient(135deg, #1060a8, #2080cc);
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; text-align: center;
      text-decoration: none; cursor: pointer;
    }
    .reset-btn {
      width: 100%; margin-top: 10px; padding: 12px;
      background: rgba(255,255,255,.07); color: #c0a8e0;
      border: 1px solid rgba(180,100,255,.2);
      border-radius: 12px; font-size: 14px; cursor: pointer;
    }

    #error-card { display: none; text-align: center; padding: 28px; }
    .error-msg { color: #ff8888; font-size: 14px; margin-bottom: 18px; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔮 TikTok動画生成</h1>
    <p>NEXA Tools &nbsp;|&nbsp; テキスト入力 → 縦型TikTok動画</p>
  </header>

  <div class="hint">
    💡 <a href="https://sns-post-beta.vercel.app/" target="_blank">SNSポストツール</a> でフック文・スクリプト・ハッシュタグを生成してからここに貼り付けてください。
  </div>

  <!-- Form -->
  <div class="card" id="form-card">
    <div class="row">
      <label class="field-label">フック文（最初の4秒）</label>
      <input type="text" id="hook" placeholder="例）好き避けしてる人だけ見て" maxlength="30">
    </div>

    <div class="row">
      <label class="field-label">スクリプト（1行20文字以内・5行）</label>
      <div class="script-grid">
        <div class="script-row"><div class="script-num">1</div><input type="text" class="script-line" placeholder="彼が目を合わせない理由" maxlength="20"></div>
        <div class="script-row"><div class="script-num">2</div><input type="text" class="script-line" placeholder="実は好意を隠してるから" maxlength="20"></div>
        <div class="script-row"><div class="script-num">3</div><input type="text" class="script-line" placeholder="他の子より言葉が少ない" maxlength="20"></div>
        <div class="script-row"><div class="script-num">4</div><input type="text" class="script-line" placeholder="SNSを必ずチェックしてる" maxlength="20"></div>
        <div class="script-row"><div class="script-num">5</div><input type="text" class="script-line" placeholder="本音は鑑定でわかる" maxlength="20"></div>
      </div>
    </div>

    <div class="row">
      <label class="field-label">CTA（最後の5秒）</label>
      <input type="text" id="cta" value="プロフィールから無料で占えます" maxlength="25">
    </div>

    <div class="row">
      <label class="field-label">テーマ</label>
      <div class="theme-row">
        <button class="theme-btn mystic active" data-theme="mystic" onclick="selectTheme(this)">🌙 Mystic</button>
        <button class="theme-btn dark"   data-theme="dark"   onclick="selectTheme(this)">🌌 Dark</button>
        <button class="theme-btn pink"   data-theme="pink"   onclick="selectTheme(this)">🌸 Pink</button>
      </div>
    </div>

    <button class="gen-btn" id="gen-btn" onclick="startGenerate()">✨ 動画を生成する</button>
  </div>

  <!-- Progress -->
  <div class="card" id="progress-card">
    <div class="spinner"></div>
    <div id="progress-text">動画を生成中...</div>
  </div>

  <!-- Result -->
  <div class="card" id="result-card">
    <div style="text-align:center; color:#c890ff; font-size:18px; font-weight:700; margin-bottom:16px;">
      動画が完成しました！
    </div>
    <a id="dl-link" class="dl-btn" href="#" download>⬇ 動画をダウンロード (.mp4)</a>
    <button class="reset-btn" onclick="resetForm()">もう一度生成する</button>
  </div>

  <!-- Error -->
  <div class="card" id="error-card">
    <div class="error-msg" id="error-msg">エラーが発生しました</div>
    <button class="reset-btn" onclick="resetForm()">もう一度試す</button>
  </div>
</div>

<script>
  let theme = 'mystic';
  let pollTimer = null;

  function selectTheme(btn) {
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    theme = btn.dataset.theme;
  }

  function show(id) {
    ['form-card','progress-card','result-card','error-card'].forEach(c => {
      document.getElementById(c).style.display = c === id ? 'block' : 'none';
    });
  }

  async function startGenerate() {
    const hook = document.getElementById('hook').value.trim();
    const lines = [...document.querySelectorAll('.script-line')].map(i => i.value.trim()).filter(v => v);
    const cta = document.getElementById('cta').value.trim();

    if (!hook) { alert('フック文を入力してください'); return; }
    if (lines.length === 0) { alert('スクリプトを1行以上入力してください'); return; }

    document.getElementById('gen-btn').disabled = true;
    show('progress-card');

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hook, script_lines: lines, cta, theme }),
      });
      const { job_id, error } = await res.json();
      if (error) { showError(error); return; }
      poll(job_id);
    } catch (e) {
      showError('通信エラーが発生しました');
    }
  }

  function poll(job_id) {
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch('/api/status/' + job_id);
        const d = await res.json();
        document.getElementById('progress-text').textContent = d.progress || '動画を生成中...';
        if (d.status === 'done') { clearInterval(pollTimer); showResult(job_id); }
        if (d.status === 'error') { clearInterval(pollTimer); showError(d.error || 'エラー'); }
      } catch (_) {}
    }, 2500);
  }

  function showResult(job_id) {
    document.getElementById('dl-link').href = '/api/download/' + job_id;
    show('result-card');
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg;
    show('error-card');
  }

  function resetForm() {
    clearInterval(pollTimer);
    document.getElementById('gen-btn').disabled = false;
    show('form-card');
  }
</script>
</body>
</html>
